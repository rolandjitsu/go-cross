name: Test
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

jobs:
  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup deps
        run: sudo apt-get update && sudo apt-get install -y autoconf automake build-essential cmake pkg-config

      - name: Checkout msgpack-c
        uses: actions/checkout@v4
        with:
          repository: msgpack/msgpack-c
          path: msgpack-c
          ref: 'c_master'

      - name: Setup msgpack
        run: |
          cd msgpack-c
          cmake -DMSGPACK_BUILD_EXAMPLES=OFF .
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run tests
        run: go test ./pkg/...

      - name: Compile native binary
        run: CGO_LDFLAGS="-L/usr/local/lib -lmsgpack-c" go build -race -o ./bin/hello cmd/hello/main.go

      - name: Verify native binary
        run: |
          out=$(./bin/hello John)
          if [ "$out" != "Hello, John!" ]; then
            echo "Binary output is not ok"
            exit 1
          fi

          out=$(./bin/hello -msgpack John)
          if [ "$out" != "Hello, John! from msgpack" ]; then
            echo "Binary output is not ok"
            exit 1
          fi

  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup QEMU user emulation
        run: sudo apt-get update && sudo apt-get install -y qemu-user gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

      - name: Compile ARM64 binary
        run: docker buildx bake hello-arm64

      - name: Compile ARMv7 binary
        run: docker buildx bake hello-arm

      - name: Verify ARM64 binary with QEMU
        run: |
          out=$(qemu-aarch64 -L /usr/aarch64-linux-gnu/ ./bin/arm64/hello John)
          if [ "$out" != "Hello, John!" ]; then
            echo "ARM64 binary output is not ok"
            exit 1
          fi

          out=$(qemu-aarch64 -L /usr/aarch64-linux-gnu/ ./bin/arm64/hello -msgpack John)
          if [ "$out" != "ARM64 binary output is not ok" ]; then
            echo "ARM64 binary output is not ok"
            exit 1
          fi

      - name: Verify ARMv7 binary with QEMU
        run: |
          out=$(qemu-arm -L /usr/arm-linux-gnueabihf/ ./bin/arm/hello John)
          if [ "$out" != "Hello, John!" ]; then
            echo "ARMv7 binary output is not ok"
            exit 1
          fi

          out=$(qemu-arm -L /usr/arm-linux-gnueabihf/ ./bin/arm/hello -msgpack John)
          if [ "$out" != "ARMv7 binary output is not ok" ]; then
            echo "ARMv7 binary output is not ok"
            exit 1
          fi
